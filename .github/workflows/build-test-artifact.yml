name: Build private test plugin ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-test-artifact.yml'
      - 'assets/**'
      - 'includes/**'
      - '*.php'
      - 'composer.json'
      - 'readme.txt'
      - 'tools/build-artifact.py'

permissions:
  contents: read

jobs:
  build-test-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Lint PHP sources
        run: find . -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l

      - name: Build installable test ZIP
        run: python3 tools/build-artifact.py --output-dir "${RUNNER_TEMP}/wpe-artifacts"

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: wpessential-return-insights-test-zip
          path: ${{ runner.temp }}/wpe-artifacts/*
          if-no-files-found: error
          retention-days: 14